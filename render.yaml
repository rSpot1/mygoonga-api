services:
  - type: web
    name: mygoonga-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG_MODE
        value: "false"
      - key: USE_MOCK_DB
        value: "false"
      - key: STORAGE_MODE
        value: firebase
      - key: CORS_ORIGINS
        value: "*"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: SIGNED_URL_SECRET
        generateValue: true
