services:
  - type: web
    name: mygoonga-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG_MODE
        value: "false"
      - key: USE_MOCK_DB
        value: "true"
      - key: STORAGE_MODE
        value: local
      - key: LOCAL_STORAGE_DIR
        value: ./storage
      - key: CORS_ORIGINS
        value: "*"
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SIGNED_URL_SECRET
        generateValue: true
